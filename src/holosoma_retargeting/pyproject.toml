[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[project]
name = "holosoma-retargeting"
version = "0.1.0"
description = "Retargeting utilities for converting human motions to robot motions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amazon FAR Team" }]
license = { text = "Apache-2.0" }
keywords = ["humanoid", "robotics", "retargeting", "motion", "smpl", "mocap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # isaaclab is co-installed and needs numpy<2; numpy 2.4 would also break yourdfpy's float(q) (urdf.py:1078)
    "numpy>=1.26,<2",
    "torch",
    "tqdm",
    "scipy",
    "matplotlib",
    "trimesh",
    "smplx",
    "jinja2",
    "viser",
    "robot_descriptions",
    "yourdfpy",
    # the SQP's output depends on the exact solver stack (mujoco minors already differ), so it is pinned
    "mujoco==3.10.0",
    "cvxpy==1.5.4",  # 1.6+ wheels need numpy>=2
    "clarabel==0.11.1",
    "libigl",
    "tyro",
    "joblib",
    "pandas",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

# uv_build packaging. FLAT layout (the holosoma_retargeting/ module lives at the
# project root, not under src/), so module-root = "". README.md now sits at the
# project root (moved up from holosoma_retargeting/README.md) so the readme
# reference resolves and the long description is packaged.
[tool.uv.build-backend]
module-name = "holosoma_retargeting"
module-root = ""
# Ship the bundled robot descriptions, meshes, motion data, and templates that
# live inside the module (the old setuptools build shipped none of these — it
# had no MANIFEST.in or package_data). Covers robot descriptions + meshes
# (urdf/xml/STL/obj/dae/mtl), motion/weight data (npy/pt/pkl), the urdf jinja
# template, and the in-module how-to docs.
source-include = [
    "holosoma_retargeting/**/*.STL",
    "holosoma_retargeting/**/*.obj",
    "holosoma_retargeting/**/*.dae",
    "holosoma_retargeting/**/*.mtl",
    "holosoma_retargeting/**/*.xml",
    "holosoma_retargeting/**/*.urdf",
    "holosoma_retargeting/**/*.jinja",
    "holosoma_retargeting/**/*.npy",
    "holosoma_retargeting/**/*.pt",
    "holosoma_retargeting/**/*.pkl",
    "holosoma_retargeting/**/*.md",
]
# OMOMO object models that data_utils/make_omomo_objects.py derives from the downloaded dataset into models/;
# they sit beside the bundled ones but are not part of the package
source-exclude = [
    "holosoma_retargeting/models/clothesstand/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_clothesstand.xml",
    "holosoma_retargeting/models/floorlamp/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_floorlamp.xml",
    "holosoma_retargeting/models/largetable/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_largetable.xml",
    "holosoma_retargeting/models/monitor/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_monitor.xml",
    "holosoma_retargeting/models/mop/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_mop.xml",
    "holosoma_retargeting/models/plasticbox/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_plasticbox.xml",
    "holosoma_retargeting/models/smallbox/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_smallbox.xml",
    "holosoma_retargeting/models/smalltable/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_smalltable.xml",
    "holosoma_retargeting/models/suitcase/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_suitcase.xml",
    "holosoma_retargeting/models/trashcan/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_trashcan.xml",
    "holosoma_retargeting/models/tripod/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_tripod.xml",
    "holosoma_retargeting/models/vacuum/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_vacuum.xml",
    "holosoma_retargeting/models/whitechair/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_whitechair.xml",
    "holosoma_retargeting/models/woodchair/**",
    "holosoma_retargeting/models/t1/t1_23dof_w_woodchair.xml",
]
